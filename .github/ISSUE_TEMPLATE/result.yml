name: Submit a verified result
description: Submit an inscribed shape found by one of the finders where none has been recorded before.
title: "Result: "
labels: ["result"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting. The finders fill this form in for you when they find a result that is not in the [registry](https://github.com/Thor110/InscribedSquareProblem/blob/main/data/registry.json) yet.
        An automated check rebuilds the curve or surface from its seed, verifies the shape independently (every pairwise distance and every vertex's distance from the curve or surface, to a relative error of 1e-9), and checks it is new. If it passes, a pull request adding it to the registry is opened automatically.
  - type: textarea
    id: result
    attributes:
      label: Result (JSON)
      description: Filled in by the finder. Please do not edit it.
      render: json
    validations: {required: true}
  - type: input
    id: author
    attributes:
      label: Author
      description: Name or pseudonym to credit (optional).
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything worth knowing about how it was found (optional).
