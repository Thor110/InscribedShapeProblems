<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeletal Shape Finder</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a0a0f;color:#e0ddd8;font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
  h1{font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:#666;margin-bottom:6px;}
  .sub{font-size:11px;color:#444;margin-bottom:16px;letter-spacing:0.1em;text-align:center;}
  #canvas{display:block;background:#0d0d14;border:1px solid #1e1e2a;cursor:crosshair;touch-action:none;max-width:100%;}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center;max-width:700px;}
  button{background:transparent;border:1px solid #2a2a3a;color:#888;padding:6px 14px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:0.1em;cursor:pointer;text-transform:uppercase;transition:all 0.15s;}
  button:hover{border-color:#555;color:#ccc;background:#111;}
  button.active{border-color:#4a9;color:#4a9;background:rgba(74,169,120,0.05);}
  select{background:#0d0d14;border:1px solid #2a2a3a;color:#888;padding:6px 10px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;text-transform:uppercase;}
  .slrow{display:flex;align-items:center;gap:10px;font-size:11px;color:#555;}
  input[type=range]{width:160px;accent-color:#4a9;}
  .meters{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px;max-width:700px;width:100%;}
  .meter{background:#0d0d14;border:1px solid #1a1a24;padding:6px 9px;}
  .mlabel{font-size:9px;color:#3a3a4a;letter-spacing:0.1em;text-transform:uppercase;}
  .mval{font-size:12px;font-weight:bold;color:#555;margin-top:1px;transition:color 0.2s;font-variant-numeric:tabular-nums;}
  .mval.match{color:#4a9;}
  .mval.warn{color:#ca6;}
  .status{margin-top:8px;font-size:11px;color:#3a3a4a;letter-spacing:0.08em;text-transform:uppercase;min-height:16px;text-align:center;max-width:700px;}
  .status.found{color:#4a9;}
  .timing{margin-top:4px;font-size:10px;color:#555;letter-spacing:0.08em;text-transform:uppercase;text-align:center;min-height:14px;}
  .chk{display:flex;align-items:center;gap:5px;font-size:11px;color:#888;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
  .chk input{accent-color:#4a9;}
  .status.active{color:#ca6;}
  .note{margin-top:6px;font-size:10px;color:#3a3a4a;max-width:700px;text-align:center;line-height:1.5;}
  .nav{margin-top:20px;font-size:10px;}
  .nav a{color:#444;text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;}
  .nav a:hover{color:#888;}
  @media (max-width:520px){.meters{grid-template-columns:repeat(2,1fr);}}
</style>
<link rel="stylesheet" href="site.css">
<script src="site-nav.js" defer></script>
</head>
<body>
<h1>Skeletal Shape Finder</h1>
<div class="sub">Edward James Gordon — Inscribed Polygon Problems</div>
<canvas id="canvas"></canvas>
<div class="controls">
  <select id="insType" aria-label="Shape to inscribe" onchange="onShapeChange()">
    <option value="square">Inscribed Square</option>
    <option value="rectangle">Inscribed Rectangle</option>
    <option value="triangle">Inscribed Equilateral Triangle</option>
    <option value="trianglex">Inscribed Triangle (any shape)</option>
    <option value="pentagon">Inscribed Regular Pentagon</option>
    <option value="hexagon">Inscribed Regular Hexagon</option>
  </select>
  <label class="chk" id="paramBox" style="display:none"><span id="paramLabel"></span><input id="param" type="text" size="7" onchange="newCurve(false)" style="background:#0d0d14;border:1px solid #2a2a3a;color:#aaa;font-family:inherit;font-size:11px;padding:4px 6px;"></label>
  <select id="shapeType" aria-label="Curve" onchange="newCurve(false)"></select>
  <button onclick="newCurve(true)">New curve</button>
  <button onclick="toggleScan()" id="scanBtn">Auto-find Equilibrium</button>
  <label class="chk" title="Keep the skeleton's rotation fixed and only move the central pivot"><input type="checkbox" id="pivotOnly" onchange="onPivotToggle()">Pivot only</label>
  <label class="slrow">Rotate<input type="range" id="rtSl" min="0" max="360" value="0" step="0.1" oninput="onRt(this.value)"><span id="rtV">0.0°</span></label>
</div>
<div class="meters" id="meterGrid"></div>
<div class="status" id="status" role="status" aria-live="polite">Ready</div>
<div class="timing" id="timing"></div>
<div class="registry" id="registry" style="display:none"></div>
<div class="note" id="note">Click inside the curve to move the jig centre. A shape is only marked as locked after an independent check of every pairwise vertex distance and every vertex's distance to the curve.</div>

<div class="nav"><a href="../index.html">← Back to suite</a></div>

<script src="shapes2d.js"></script>
<script src="inscribed-2d.js"></script>
<script src="registry.js"></script>
<script>
'use strict';
// Verification tolerance: maximum relative error allowed in every pairwise vertex
// distance and in every vertex's distance to the curve.
const TOL = 1e-9;

const cv = document.getElementById('canvas'), ctx = cv.getContext('2d');
let W, H, curve = [], S = 1, seed = 1;
let G = null;   // curve geometry (Inscribed2D.geometry: ray hits, all crossings, distance, inside)
let jig = { x: 0, y: 0, ang: 0 }, view = null, locked = null, search = null, scanId = null;
// Which boundary crossing each jig arm grips: 'far' = farthest (default),
// 'near' = first, 'track' = the crossing closest to trackTargets[k]. The last two
// are needed on curves that are not star-shaped, where a square's vertex can be a
// middle crossing of the ray.
let hitMode = 'far', trackTargets = null;

const $ = id => document.getElementById(id);
const insType = () => $('insType').value;

// ---------- target shapes ----------
// Each jig is a set of ray directions from the pivot, chosen so that when every
// ray has the same length the hit points form the target shape (they lie on a
// circle around the pivot at those angles). The jig has 3 DoF (x, y, rotation).
//  'chords': two chords through the pivot (square, rectangle). 3 equalities:
//            bisect both chords, then equal diagonals. Found by the IVT sweep.
//  'family': 2 equalities (triangles), so found at any rotation.
//  'over':   more equalities than DoF (regular pentagon 4, hexagon 5), so not
//            expected on a general curve; the search reports the closest candidate.
let SPEC = null;
const PARAM_DEFAULTS = { rectangle: '2', trianglex: '50,70' };
function buildSpec() {
  const t = insType(), p = $('param').value, deg = Math.PI / 180;
  const reg = (n, kind) => ({ dirs: Array.from({ length: n }, (_, k) => (2 * Math.PI * k) / n), kind, period: (2 * Math.PI) / n, balanced: true });
  switch (t) {
    case 'rectangle': {
      // an aspect below 1 is the same rectangle turned sideways; anything invalid falls back to 2
      const v = +p, a = v > 0 && isFinite(v) ? Math.max(v, 1 / v) : 2, al = Math.atan(1 / a);
      if (+$('param').value !== a) $('param').value = +a.toFixed(6);   // show the value actually searched
      return { name: `rectangle (aspect ${+a.toFixed(4)})`, short: 'rectangle', aspect: a, dirs: [al, Math.PI - al, Math.PI + al, 2 * Math.PI - al], kind: 'chords', period: Math.PI, balanced: true };
    }
    case 'triangle': return Object.assign(reg(3, 'family'), { name: 'equilateral triangle', short: 'triangle' });
    case 'trianglex': {
      let [A, B] = p.split(',').map(Number);
      if (!(A > 0 && B > 0 && A + B < 180)) { A = 50; B = 70; $('param').value = '50,70'; }   // show the angles actually searched
      const C = 180 - A - B;
      // Vertices on a circle about the pivot: consecutive central angles 2C, 2A, 2B.
      return { name: `triangle (${+A.toFixed(2)}°, ${+B.toFixed(2)}°, ${+C.toFixed(2)}°)`, short: 'triangle', dirs: [0, 2 * C * deg, 2 * (C + A) * deg], kind: 'family', period: 2 * Math.PI, balanced: false };
    }
    case 'pentagon': return Object.assign(reg(5, 'over'), { name: 'regular pentagon', short: 'pentagon' });
    case 'hexagon': return Object.assign(reg(6, 'over'), { name: 'regular hexagon', short: 'hexagon' });
    default: return Object.assign(reg(4, 'chords'), { name: 'square', short: 'square' });
  }
}
const nRays = () => SPEC.dirs.length;
function onShapeChange() {
  const t = insType();
  $('paramBox').style.display = PARAM_DEFAULTS[t] ? '' : 'none';
  $('paramLabel').textContent = t === 'rectangle' ? 'Aspect' : t === 'trianglex' ? 'Angles A,B' : '';
  $('param').value = PARAM_DEFAULTS[t] || '';   // a rectangle's aspect means nothing to a triangle, and vice versa
  newCurve(false);
}

function resize() {
  const mw = Math.min(window.innerWidth - 40, 700), dpr = window.devicePixelRatio || 1;
  W = mw; H = Math.round(mw * 0.68);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = 'auto';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------- curve geometry ----------
// Shared with the studies (pages/inscribed-2d.js); the same arithmetic the page used to
// carry its own copy of, so searches and the demo GIFs are unchanged.
function buildCurve(pts) { curve = pts; G = Inscribed2D.geometry(pts); S = G.S; }
// Farthest (or, in 'near' mode, first) intersection of the ray o + t·d (t > 0) with the curve; -1 if none.
const rayHit = (ox, oy, dx, dy) => G.hit(ox, oy, dx, dy, hitMode === 'near' ? 'near' : 'far');
const rayHitsAll = (ox, oy, dx, dy) => G.all(ox, oy, dx, dy);   // all crossings (t > 0), sorted
const distToCurve = (px, py) => G.dist(px, py);
const insideCurve = (px, py) => G.inside(px, py);

// ---------- the skeletal jig ----------
// One ray per jig direction from (x,y), rotated by ang; returns the ray lengths or null.
function rays(x, y, ang) {
  const r = [], D = SPEC.dirs;
  for (let k = 0; k < D.length; k++) {
    const a = ang + D[k];
    let t;
    if (hitMode === 'track') {
      const all = rayHitsAll(x, y, Math.cos(a), Math.sin(a)); if (!all.length) return null;
      t = all.reduce((b, v) => (Math.abs(v - trackTargets[k]) < Math.abs(b - trackTargets[k]) ? v : b));
    } else t = rayHit(x, y, Math.cos(a), Math.sin(a));
    if (t < 0) return null;
    r.push(t);
  }
  return r;
}
function hits(x, y, ang, r) {
  return r.map((t, k) => { const a = ang + SPEC.dirs[k]; return { x: x + t * Math.cos(a), y: y + t * Math.sin(a) }; });
}
// Spread of the ray lengths around their mean (zero <=> the target shape).
const spreadRes = r => { const m = r.reduce((a, b) => a + b, 0) / r.length; return r.map(v => (v - m) / S); };
// Centering equations at a fixed angle. Chords: both chords bisected (rhombus or
// parallelogram). Family: all rays equal. Over: least-squares equal rays.
function centerRes(x, y, ang) {
  const r = rays(x, y, ang); if (!r) return null;
  if (SPEC.kind === 'chords') return [(r[0] - r[2]) / S, (r[1] - r[3]) / S];
  if (SPEC.kind === 'family') return [(r[0] - r[1]) / S, (r[1] - r[2]) / S];
  return spreadRes(r);
}
// Full equations in (x, y, angle). Chords: bisected chords + equal diagonals.
function squareRes(p) {
  const r = rays(p[0], p[1], p[2]); if (!r) return null;
  if (SPEC.kind === 'chords') return [(r[0] - r[2]) / S, (r[1] - r[3]) / S, (r[0] + r[2] - r[1] - r[3]) / S];
  return spreadRes(r);
}

// ---------- Newton solver (finite-difference Jacobian, backtracking) ----------
const norm = f => Math.sqrt(f.reduce((s, v) => s + v * v, 0));
// Newton's method with a finite-difference Jacobian and backtracking, and a Gauss–Newton
// step when there are more equations than unknowns (pages/shapes2d.js).
const newton = Shapes2D.newton;
const H2 = () => [1e-7 * S, 1e-7 * S], H3 = () => [1e-7 * S, 1e-7 * S, 1e-8];

// The "rattle": damped iteration moving the centre toward the chord midpoints
// (square) or the centroid of the hits (triangle). Gets close; Newton finishes.
function rattle(x, y, ang, iters) {
  const n = nRays();
  if (!SPEC.balanced) return rays(x, y, ang) ? { x, y } : null;   // centroid target only suits symmetric jigs
  for (let i = 0; i < iters; i++) {
    const r = rays(x, y, ang); if (!r) return null;
    const P = hits(x, y, ang, r); let tx = 0, ty = 0;
    for (const p of P) { tx += p.x / n; ty += p.y / n; }
    const nx = x + 0.6 * (tx - x), ny = y + 0.6 * (ty - y);
    if (Math.hypot(nx - x, ny - y) < 1e-6 * S) { x = nx; y = ny; break; }
    x = nx; y = ny;
  }
  return { x, y };
}
function solveCenter(x, y, ang, rattleIters = 0) {
  if (rattleIters) { const q = rattle(x, y, ang, rattleIters); if (q) { x = q.x; y = q.y; } }
  const r = newton(p => centerRes(p[0], p[1], ang), [x, y], H2(), 50);
  return r && r.nf < 1e-11 ? { x: r.x[0], y: r.x[1] } : null;
}

// ---------- independent verification ----------
// Compares all pairwise vertex distances with the target shape at its best-fit
// scale, and checks each vertex lies on the curve. Errors are relative to the
// target's shortest edge.
function verify(P) {
  const n = P.length, d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const U = SPEC.dirs.map(t => ({ x: Math.cos(t), y: Math.sin(t) }));
  let num = 0, den = 0, minU = Infinity;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const u = d(U[i], U[j]); num += d(P[i], P[j]) * u; den += u * u; minU = Math.min(minU, u); }
  const rho = num / den, s = rho * minU;
  let shapeErr = 0;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) shapeErr = Math.max(shapeErr, Math.abs(d(P[i], P[j]) - rho * d(U[i], U[j])) / s);
  let curveErr = 0; for (const p of P) curveErr = Math.max(curveErr, distToCurve(p.x, p.y) / s);
  const err = Math.max(shapeErr, curveErr), big = s > 1e-3 * S;
  return { shapeErr, curveErr, err, size: s, ok: err < TOL && big };
}

// ---------- state + drawing ----------
function computeView() {
  const r = rays(jig.x, jig.y, jig.ang);
  view = r ? { r, P: hits(jig.x, jig.y, jig.ang, r) } : null;
}

function fmt(e) { return e === 0 ? '0' : e.toExponential(2); }

function updateMeters() {
  const grid = $('meterGrid'); grid.innerHTML = '';
  const add = (label, val, cls) => { const m = document.createElement('div'); m.className = 'meter'; m.innerHTML = `<div class="mlabel">${label}</div><div class="mval ${cls || ''}">${val}</div>`; grid.appendChild(m); };
  const P = locked ? locked.P : view && view.P; if (!P) return null;
  const v = verify(P), cls = v.ok ? 'match' : '';
  const L = 'ABCDEF', d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  for (let i = 0; i < P.length; i++) add(`Side ${L[i]}${L[(i + 1) % P.length]}`, d(P[i], P[(i + 1) % P.length]).toFixed(6), cls);
  if (P.length === 4) { add('Diag A-C', d(P[0], P[2]).toFixed(6), cls); add('Diag B-D', d(P[1], P[3]).toFixed(6), cls); }
  add('Shape error (rel.)', fmt(v.shapeErr), v.shapeErr < TOL ? 'match' : 'warn');
  add('Off-curve error (rel.)', fmt(v.curveErr), v.curveErr < TOL ? 'match' : 'warn');
  return v;
}

function setStatus(text, cls) { const st = $('status'); st.textContent = text; st.className = 'status ' + (cls || ''); }

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.beginPath(); ctx.moveTo(curve[0].x, curve[0].y);
  for (const p of curve) ctx.lineTo(p.x, p.y);
  ctx.closePath(); ctx.fillStyle = 'rgba(20,30,50,0.6)'; ctx.fill('evenodd');
  ctx.strokeStyle = '#2a4a7a'; ctx.lineWidth = 1.2; ctx.stroke();

  const src = locked || (view && { P: view.P, x: jig.x, y: jig.y, ang: jig.ang });
  if (!src) { ctx.beginPath(); ctx.arc(jig.x, jig.y, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#e55'; ctx.fill(); return; }
  const n = src.P.length;
  ctx.setLineDash([2, 2]); ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  for (let k = 0; k < n; k++) {
    const a = src.ang + SPEC.dirs[k];
    ctx.beginPath(); ctx.moveTo(src.x, src.y); ctx.lineTo(src.x + Math.cos(a) * W * 2, src.y + Math.sin(a) * W * 2); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(src.P[0].x, src.P[0].y);
  for (let i = 1; i < n; i++) ctx.lineTo(src.P[i].x, src.P[i].y);
  ctx.closePath(); ctx.strokeStyle = locked ? '#4a9' : '#ca6'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = locked ? 'rgba(74,153,120,0.12)' : 'rgba(200,160,80,0.06)'; ctx.fill();
  src.P.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2); ctx.fillStyle = locked ? '#4a9' : '#ca6'; ctx.fill(); });
  ctx.beginPath(); ctx.arc(src.x, src.y, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
}

// Registry: when a verified shape is showing, check it against the list of
// verified results and offer to submit it if it is new.
let FIT = { s: 1, ox: 0, oy: 0 };
function showRegistry(P) {
  const el = $('registry');
  if (!P) { el.style.display = 'none'; return; }
  const type = $('shapeType').value, t = insType();
  Registry.panel(el, {
    dim: 2, shape: t === 'trianglex' ? 'triangle' : t, aspect: t === 'rectangle' ? SPEC.aspect : undefined,
    curve: { type, seed, level: Shapes2D.DEFAULT_LEVEL[type] },
    vertices: P.map(p => [(p.x - FIT.ox) / FIT.s, (p.y - FIT.oy) / FIT.s]), finder: 'Skeletal Shape Finder',
  });
}
function refresh() {
  if (!locked) computeView();
  draw();
  const v = updateMeters();
  showRegistry(search ? null : locked ? locked.P : v && v.ok ? view.P : null);
  if (search) return;
  const name = SPEC.name;
  if (locked) setStatus(`Inscribed ${name} verified — max relative error ${fmt(locked.v.err)}`, 'found');
  else if (!view) setStatus('Jig centre has no valid hits here — click inside the curve', '');
  else if (v && v.ok) setStatus(`Inscribed ${name} verified — max relative error ${fmt(v.err)}`, 'found');
  else if (SPEC.kind === 'chords' && view.centered) setStatus(`${insType() === 'square' ? 'Rhombus' : 'Parallelogram'} (both chords bisected) — diagonals differ by ${fmt(Math.abs(view.r[0] + view.r[2] - view.r[1] - view.r[3]) / S)} of curve size`, '');
  else if (SPEC.kind === 'over' && view.centered) setStatus(`Closest centring at this rotation — ray lengths spread by ${fmt(v ? v.shapeErr : NaN)}`, '');
  else setStatus(view.centered === false ? 'Centering did not converge from here — try another point' : 'Rattling toward equilibrium…', '');
}

// Re-centre the jig at the current angle (the "rattle").
function recenter() {
  hitMode = 'far';
  const c = solveCenter(jig.x, jig.y, jig.ang, 40);
  if (c) { jig.x = c.x; jig.y = c.y; }
  computeView(); if (view) view.centered = !!c;
}

function onRt(v) {
  stopScan(); locked = null; jig.ang = (+v * Math.PI) / 180; $('rtV').textContent = (+v).toFixed(1) + '°';
  recenter(); refresh();
}

function syncSlider() {
  const deg = ((((jig.ang * 180) / Math.PI) % 360) + 360) % 360;
  $('rtSl').value = deg.toFixed(1); $('rtV').textContent = deg.toFixed(1) + '°';
}

// Starting points for the search: the deepest interior point first, then a spread of others.
let startsCache = null;   // the starting points depend only on the curve and the seed
function interiorStarts() {
  if (startsCache && startsCache.curve === curve && startsCache.seed === seed) return startsCache.out.map(p => ({ ...p }));
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of curve) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  const pts = [], G = 22;
  for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {
    const x = x0 + ((i + 0.5) / G) * (x1 - x0), y = y0 + ((j + 0.5) / G) * (y1 - y0);
    if (insideCurve(x, y)) pts.push({ x, y, d: distToCurve(x, y) });
  }
  pts.sort((a, b) => b.d - a.d);
  const R = Shapes2D.rng(seed * 7 + 1), out = pts.slice(0, 1);
  const rest = pts.slice(1).filter(p => p.d > 0.02 * S);
  while (out.length < 12 && rest.length) out.push(rest.splice(Math.floor(R() * rest.length), 1)[0]);
  startsCache = { curve, seed, out };
  return out.map(p => ({ ...p }));
}

function resetJig() {
  stopScan(); locked = null;
  const st = interiorStarts()[0] || { x: W / 2, y: H / 2 };
  jig = { x: st.x, y: st.y, ang: ((+$('rtSl').value || 0) * Math.PI) / 180 };
  recenter(); refresh();
}

function newCurve(fresh) {
  stopScan();
  if (fresh) seed = (Math.random() * 2 ** 31) | 0;
  SPEC = buildSpec();
  const unit = Shapes2D.generate($('shapeType').value, seed);
  FIT = Shapes2D.fitTransform(unit, W, H, 24);
  buildCurve(Shapes2D.fit(unit, W, H, 24));
  $('rtSl').value = 0; resetJig(); updateURL();
}
function onPivotToggle() { stopScan(); locked = null; hitMode = 'far'; refresh(); updateURL(); }
function updateURL() {
  const url = new URL(location.href);
  url.searchParams.set('shape', insType()); url.searchParams.set('curve', $('shapeType').value); url.searchParams.set('seed', seed);
  if ($('param').value) url.searchParams.set('p', $('param').value); else url.searchParams.delete('p');
  if (pivotOnly()) url.searchParams.set('pivot', '1'); else url.searchParams.delete('pivot');
  history.replaceState(null, '', url);
  showEstimate();
}

// ---------- pivot only + timing ----------
// "Pivot only" keeps the skeleton's rotation fixed and only jiggles the central
// pivot (2 DoF). An equilateral triangle needs only 2 equalities, so it is found
// at any rotation; a square needs 3, so it generally needs the rotation as well.
const pivotOnly = () => $('pivotOnly').checked;
// ?pace=N limits the search to N steps per animation frame, to watch it in slow motion.
const PACE = +new URLSearchParams(location.search).get('pace') || 0;
const est = () => Shapes2D.estimate(insType(), $('shapeType').value, pivotOnly());
function showEstimate() { $('timing').textContent = `Estimated search time: ${est()}${est() === '∞' ? ' (no exact solution expected here)' : ''}`; }
function showTiming(s) {
  const el = (performance.now() - s.t0) / 1000, left = s.y > 0 ? (el * Math.max(0, s.total - s.y)) / s.y : NaN;
  $('timing').textContent = `Elapsed ${el.toFixed(0)} s · estimate ${est()}` + (isFinite(left) ? ` · at most ~${Math.ceil(left)} s left` : '');
}
const PIVOT_TRIES = 80;
function* pivotGen(s) {
  s.phase = 0;
  const ang = jig.ang, R = Shapes2D.rng(seed * 17 + 3), pts = s.starts.slice();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of curve) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  for (let i = 0; i < PIVOT_TRIES; i++) pts.push({ x: x0 + R() * (x1 - x0), y: y0 + R() * (y1 - y0) });
  s.k = 0;
  for (const mode of ['far', 'near']) {
    hitMode = s.mode = mode;
    for (const p of pts) {
      s.k++; s.ang = ang;
      // Hand every centred candidate to verify(); on rough fractals Newton may stall
      // short of its own threshold while the result still verifies.
      const q = rattle(p.x, p.y, ang, 60) || p, nr = newton(z => centerRes(z[0], z[1], ang), [q.x, q.y], H2(), 100);
      const c = nr && { x: nr.x[0], y: nr.x[1] }; s.tries++;
      if (c) { if (accept(c.x, c.y, ang)) return true; Object.assign(jig, { x: c.x, y: c.y, ang }); }
      yield;
    }
  }
  // Tracking jig: each arm starts on a randomly chosen crossing of its ray.
  hitMode = s.mode = 'track';
  const n = nRays();
  for (let t = 0; t < PIVOT_TRIES * 4; t++) {
    s.k++;
    const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0);
    trackTargets = [];
    for (let k = 0; k < n; k++) {
      const a = ang + SPEC.dirs[k], all = rayHitsAll(x, y, Math.cos(a), Math.sin(a));
      if (!all.length) break;
      trackTargets.push(all[Math.floor(R() * all.length)]);
    }
    if (trackTargets.length === n) {
      let z = [x, y];
      for (let outer = 0; outer < 25; outer++) {
        const nr = newton(q => centerRes(q[0], q[1], ang), z, H2(), 3); if (!nr) break;
        z = nr.x; const r = rays(z[0], z[1], ang); if (!r) break; trackTargets = r;
        if (nr.nf < 1e-15) break;
      }
      s.tries++;
      if (accept(z[0], z[1], ang)) return true;
    }
    yield;
  }
  return false;
}

// ---------- automatic search ----------
// Phase 1 (square): for each start point, sweep the angle over 90° with the jig
// kept centred. Rotating by 90° swaps the chords, so the diagonal difference
// changes sign; each sign change seeds a full Newton solve. On non-convex curves
// the centred jig can jump between branches; such sign changes fail verification
// and the sweep continues. (Triangle: centering alone forces an equilateral
// triangle at any angle, so phase 1 just centres the jig at a few angles.)
// Phase 1 runs with the farthest-hit jig, then again with the nearest-hit jig.
// Phase 2: Newton from many random positions and angles, both jig modes.
// Only results that pass verify() are ever accepted.
const STEP = (0.25 * Math.PI) / 180, RANDOM_TRIES = 600, TRACK_TRIES = 1500;
function* searchGen(s) {
  const tri = SPEC.kind === 'family', P0 = SPEC.period;
  for (const mode of SPEC.kind === 'over' ? [] : ['far', 'near']) {
    hitMode = s.mode = mode;
    for (s.si = 0; s.si < s.starts.length; s.si++) {
      const st = s.starts[s.si];
      if (tri) {
        for (let k = 0; k < 8; k++) {
          s.ang = jig.ang0 + (k * P0) / 8;
          const c = solveCenter(st.x, st.y, s.ang, 60); s.tries++;
          if (c && accept(c.x, c.y, s.ang)) return true;
          yield;
        }
        continue;
      }
      let x = st.x, y = st.y, prev = null;
      for (s.ang = 0; s.ang <= P0 + STEP; s.ang += STEP) {
        const c = solveCenter(x, y, s.ang, prev ? 0 : 60);
        if (c) {
          x = c.x; y = c.y; Object.assign(jig, { x, y, ang: s.ang });
          const r = rays(x, y, s.ang);
          if (r) {
            const delta = (r[0] + r[2] - r[1] - r[3]) / S;
            if (prev && prev.delta * delta <= 0) {
              const f = prev.delta / (prev.delta - delta || 1);
              const g = [prev.x + f * (x - prev.x), prev.y + f * (y - prev.y), prev.ang + f * (s.ang - prev.ang)];
              const sol = newton(squareRes, g, H3(), 80); s.tries++;
              if (sol && accept(sol.x[0], sol.x[1], sol.x[2])) return true;
              s.jumps++;
            }
            prev = { x, y, ang: s.ang, delta };
          }
        } else { prev = null; x = st.x; y = st.y; }
        yield;
      }
    }
  }
  // Phase 2: random multi-start over the whole bounding box.
  s.phase = 2;
  const R = Shapes2D.rng(seed * 13 + 5);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of curve) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  for (s.k = 0; s.k < RANDOM_TRIES; s.k++) {
    hitMode = s.mode = s.k % 2 ? 'near' : 'far';
    const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0), ang = R() * P0;
    const q = rattle(x, y, ang, 40); if (!q) { yield; continue; }
    s.tries++;
    if (tri) { const c = solveCenter(q.x, q.y, ang); if (c && accept(c.x, c.y, ang)) return true; }
    else { const sol = newton(squareRes, [q.x, q.y, ang], H3(), 80); if (sol && accept(sol.x[0], sol.x[1], sol.x[2])) return true; }
    Object.assign(jig, { x: q.x, y: q.y, ang });
    yield;
  }
  // Phase 3: tracking jig. Each arm starts on a randomly chosen crossing and then
  // follows the crossing nearest its current length while Newton runs.
  s.phase = 3; hitMode = s.mode = 'track';
  for (s.k = 0; s.k < TRACK_TRIES; s.k++) {
    const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0), n = nRays();
    let ang = R() * P0;
    trackTargets = [];
    for (let k = 0; k < n; k++) {
      const a = ang + SPEC.dirs[k], all = rayHitsAll(x, y, Math.cos(a), Math.sin(a));
      if (!all.length) break;
      trackTargets.push(all[Math.floor(R() * all.length)]);
    }
    if (trackTargets.length < n) { yield; continue; }
    // Pick a centre that splits the chosen crossings evenly, then run Newton,
    // refreshing the targets between short Newton bursts.
    let p = tri ? [x, y] : [x, y, ang];
    for (let outer = 0; outer < 25; outer++) {
      const F = tri ? (q => centerRes(q[0], q[1], ang)) : squareRes;
      const sol = newton(F, p, tri ? H2() : H3(), 3); if (!sol) break;
      p = sol.x; const r = rays(p[0], p[1], tri ? ang : p[2]); if (!r) break;
      trackTargets = r;
      if (sol.nf < 1e-15) break;
    }
    s.tries++;
    if (tri ? accept(p[0], p[1], ang) : accept(p[0], p[1], p[2])) return true;
    Object.assign(jig, { x: p[0], y: p[1], ang: tri ? ang : p[2] });
    yield;
  }
  return false;
}

function startScan() {
  cancelAnimationFrame(scanId);   // never run two search loops at once
  $('registry').style.display = 'none';
  locked = null;
  search = { starts: interiorStarts(), si: 0, ang: 0, jumps: 0, tries: 0, best: null, phase: 1, k: 0, mode: 'far', t0: performance.now(), y: 0 };
  jig.ang0 = jig.ang;
  const n = search.starts.length;
  const per = SPEC.kind === 'family' ? 8 : SPEC.kind === 'chords' ? Math.ceil(SPEC.period / STEP) + 2 : 0;
  search.total = pivotOnly() ? 2 * (n + PIVOT_TRIES) + 4 * PIVOT_TRIES : 2 * n * per + RANDOM_TRIES + TRACK_TRIES;
  search.gen = pivotOnly() ? pivotGen(search) : searchGen(search);
  $('scanBtn').textContent = 'Stop Scan'; $('scanBtn').classList.add('active');
  scanId = requestAnimationFrame(scanStep);
}
function stopScan() {
  search = null; cancelAnimationFrame(scanId);
  $('scanBtn').textContent = 'Auto-find Equilibrium'; $('scanBtn').classList.remove('active');
}
function toggleScan() { search ? (stopScan(), hitMode = 'far', refresh()) : startScan(); }

function accept(x, y, ang) {
  const r = rays(x, y, ang); if (!r) return false;
  const P = hits(x, y, ang, r), v = verify(P);
  if (!search.best || v.err < search.best.v.err) search.best = { x, y, ang, P, v, mode: hitMode, targets: hitMode === 'track' ? trackTargets.slice() : null };
  if (!v.ok) return false;
  locked = { x, y, ang, P, v, mode: hitMode }; jig = { x, y, ang }; syncSlider();
  return true;
}

function finishScan(found) {
  const s = search; stopScan();
  if (!found && s.best) { hitMode = s.best.mode; if (s.best.targets) trackTargets = s.best.targets; jig = { x: s.best.x, y: s.best.y, ang: s.best.ang }; syncSlider(); computeView(); }
  refresh();
  if (found && locked.mode !== 'far') $('status').textContent += locked.mode === 'near' ? ' (nearest-hit jig)' : ' (tracking jig)';
  if (!found) setStatus(pivotOnly()
    ? `No verified ${SPEC.short} at this fixed rotation (${s.tries} pivot positions). Best error ${s.best ? fmt(s.best.v.err) : 'n/a'}${SPEC.kind !== 'family' ? ` — a ${SPEC.short} also needs the rotation` : ''}`
    : `No verified ${SPEC.short} found (${s.tries} candidates, ${s.jumps} rejected at discontinuities). Closest candidate error ${s.best ? fmt(s.best.v.err) : 'n/a'}`, 'active');
  $('timing').textContent = `Search took ${((performance.now() - s.t0) / 1000).toFixed(1)} s (estimate ${est()})`;
  hitMode = 'far';
}

function scanStep() {
  if (!search) return;
  const t0 = performance.now(), s = search;
  for (let n = 0; performance.now() - t0 < 14 && !(PACE && n >= PACE); n++) {
    const r = s.gen.next(); s.y++;
    if (r.done) { finishScan(r.value); return; }
  }
  computeView(); syncSlider(); draw(); updateMeters(); showTiming(s);
  setStatus(s.phase === 0 ? `Jiggling pivot ${s.k}/${s.total} (${s.mode}-hit jig), rotation fixed`
    : s.phase === 1
    ? `Sweep (${s.mode}-hit jig) ${((s.ang * 180) / Math.PI).toFixed(1)}° — start ${s.si + 1}/${s.starts.length}, ${s.tries} candidates, ${s.jumps} discontinuities`
    : s.phase === 2 ? `Random restarts ${s.k}/${RANDOM_TRIES} (${s.mode}-hit jig), ${s.tries} candidates`
    : `Tracking-jig restarts ${s.k}/${TRACK_TRIES}, ${s.tries} candidates`, 'active');
  scanId = requestAnimationFrame(scanStep);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  stopScan(); locked = null; jig.x = ((e.clientX - r.left) * W) / r.width; jig.y = ((e.clientY - r.top) * H) / r.height;
  recenter(); refresh();
});

// ---------- start-up ----------
document.head.insertAdjacentHTML('beforeend', `<style>${Registry.PANEL_CSS}</style>`);
Shapes2D.populateSelect($('shapeType'));
const params = new URLSearchParams(location.search);
if ([...$('insType').options].some(o => o.value === params.get('shape'))) $('insType').value = params.get('shape');
if (params.get('p')) $('param').value = params.get('p');
$('paramBox').style.display = PARAM_DEFAULTS[insType()] ? '' : 'none';
$('paramLabel').textContent = insType() === 'rectangle' ? 'Aspect' : insType() === 'trianglex' ? 'Angles A,B' : '';
if (PARAM_DEFAULTS[insType()] && !$('param').value) $('param').value = PARAM_DEFAULTS[insType()];
$('pivotOnly').checked = params.get('pivot') === '1';
if (params.get('curve') && Shapes2D.list.some(([v]) => v === params.get('curve'))) $('shapeType').value = params.get('curve');
seed = params.has('seed') ? (+params.get('seed') | 0) : (Math.random() * 2 ** 31) | 0;
resize();
newCurve(false);
</script>
</body>
</html>
